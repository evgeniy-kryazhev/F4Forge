name: Windows

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-analyze:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install xmake and cppcheck
        shell: pwsh
        run: |
          winget install --id Xmake-io.Xmake --exact --accept-source-agreements --accept-package-agreements
          winget install --id Cppcheck.Cppcheck --exact --version 2.20.0 --accept-source-agreements --accept-package-agreements

          $machinePath = [Environment]::GetEnvironmentVariable("Path", "Machine")
          $userPath = [Environment]::GetEnvironmentVariable("Path", "User")
          $env:Path = "$machinePath;$userPath"

          $xmake = Get-Command xmake -ErrorAction Stop
          $cppcheck = Get-Command cppcheck -ErrorAction Stop
          (Split-Path -Parent $xmake.Source) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          (Split-Path -Parent $cppcheck.Source) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          xmake --version
          cppcheck --version

      - name: Build and test
        shell: pwsh
        run: .\scripts\test.ps1

      - name: Generate compile commands
        shell: pwsh
        working-directory: native
        run: xmake project -k compile_commands

      - name: Cppcheck
        shell: pwsh
        run: .\scripts\cppcheck.ps1
