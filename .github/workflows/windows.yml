name: Windows

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test-analyze:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install xmake and cppcheck
        shell: pwsh
        run: |
          choco install xmake cppcheck --no-progress --yes

      - name: Build and test
        shell: pwsh
        run: .\scripts\test.ps1

      - name: Generate compile commands
        shell: pwsh
        working-directory: native
        run: xmake project -k compile_commands

      - name: Cppcheck
        shell: pwsh
        run: .\scripts\cppcheck.ps1
